:root{--bg:#FFF8F7;--surface:#FFFFFF;--ink:#3B2A45;--muted:#6E5A78;--accent:#C63F79;--line:#F0DDE6;--p:#EDE6FB;--font:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#35293F;--surface:#43344F;--ink:#F8EEF6;--muted:#D2BFD1;--accent:#F28FB6;--line:#5C4A6A;--p:#403A5A}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,var(--bg),var(--p));color:var(--ink);font:400 18px/1.65 var(--font);padding:24px}
.card{max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:40px 32px;text-align:center}
h1{font-size:clamp(26px,5vw,36px);line-height:1.2;font-weight:800;margin:0 0 14px}
p{margin:0 0 1em;color:var(--muted)}
a{color:var(--accent);overflow-wrap:anywhere}
.back{display:inline-block;margin-top:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:800;padding:14px 30px;border-radius:999px}
</style>
